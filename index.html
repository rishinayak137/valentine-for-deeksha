<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Deeksha ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg1:#ff758c; --bg2:#ff7eb3; --text:#fff;
}
body.night {
  --bg1:#0f2027; --bg2:#203a43; --text:#f8f8f8;
}

body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  font-family:'Segoe UI',sans-serif;
  color:var(--text);
  text-align:center;
  transition:0.8s;
}

.page {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1 { font-size:3.2rem; }
h2 { font-weight:300; }

.heart {
  font-size:5rem;
  animation:beat 1.2s infinite;
}
@keyframes beat { 50% { transform:scale(1.1); } }

/* BUTTONS */
.buttons {
  margin-top:25px;
  position:relative;
  width:100%;
  height:150px;
}

button {
  font-size:1.2rem;
  padding:12px 35px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

#yesBtn {
  background:#ff2e63;
  color:white;
}

#noBtn {
  background:white;
  color:#ff2e63;
  position:absolute;
  left:55%;
}

/* SAD TEXT */
#sadText {
  margin-top:20px;
  font-size:1.5rem;
  animation:shake 0.4s;
}
@keyframes shake {
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
}

/* CRYING EMOJI */
.cry {
  position:fixed;
  font-size:28px;
  animation:fall 3s linear forwards;
}
@keyframes fall {
  to { transform:translateY(100vh); opacity:0; }
}

/* SUCCESS */
#successPage { display:none; }

.slideshow img {
  width:180px;
  height:180px;
  border-radius:15px;
  object-fit:cover;
  animation:fade 2.5s infinite;
}
@keyframes fade {
  0%{opacity:0;} 20%{opacity:1;}
  80%{opacity:1;} 100%{opacity:0;}
}

/* CONFETTI */
.confetti {
  position:fixed;
  width:10px;height:10px;
  animation:fall 3s linear forwards;
}

/* LOVE LETTER */
#letter {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}
#letter div {
  background:white;
  color:#ff2e63;
  padding:25px;
  border-radius:15px;
  width:80%;
  max-width:350px;
}

/* NIGHT MODE BTN */
#mode {
  position:fixed;
  top:15px;
  right:15px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="mode">🌙</div>

<div class="page" id="questionPage">
  <div class="heart">❤️</div>
  <h1>Deeksha</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 🙄</button>
  </div>

  <div id="sadText"></div>
</div>

<div class="page" id="successPage">
  <h1>YAYYYY 😍</h1>
  <h2 id="typingText"></h2>

  <div class="slideshow">
    <img id="slide" src="photo1.jpg">
  </div>

  <p>Forever to go, Deeksha 💌</p>
</div>

<div id="letter">
  <div>
    <h2>My Love 💖</h2>
    <p>
      From today, every heartbeat is yours.  
      Thank you for choosing me 🥹💍
    </p>
    <p>(Tap anywhere to close)</p>
  </div>
</div>

<div id="musicContainer"></div>

<script>
const noBtn=document.getElementById("noBtn");
const sadText=document.getElementById("sadText");
let noCount=0;

const messages=[
 "Are you sure? 😟",
 "You are breaking my heart 💔",
 "Don't do this please 🥺",
 "I am a cute baby 😭👉👈",
 "Pleaseeeee 😭💖",
 "I will cry forever 😭😭😭"
];

/* NO BUTTON – NEVER DISAPPEARS */
function moveNo(){
  noCount++;
  noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(window.innerHeight-80)+"px";
  sadText.innerHTML=messages[Math.min(noCount-1,messages.length-1)];

  // crying emojis
  for(let i=0;i<3;i++){
    const c=document.createElement("div");
    c.className="cry";
    c.innerHTML="😭";
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* YES */
document.getElementById("yesBtn").onclick=()=>{
  questionPage.style.display="none";
  successPage.style.display="flex";

  // music from 50s
  musicContainer.innerHTML=`
  <iframe width="0" height="0"
  src="https://www.youtube.com/embed/2Vv-BfVoq4g?autoplay=1&start=50"
  allow="autoplay"></iframe>`;

  // typing
  let t="You've made me the luckiest person 💕",i=0;
  (function type(){
    if(i<t.length){
      typingText.innerHTML+=t[i++];
      setTimeout(type,60);
    }
  })();

  // love letter
  setTimeout(()=>letter.style.display="flex",3000);
};

/* SLIDESHOW */
const imgs=["photo1.jpg","photo2.jpg","photo3.jpg"];
let s=0;
setInterval(()=>{
  slide.src=imgs[s++%imgs.length];
},2500);

/* NIGHT MODE */
mode.onclick=()=>{
  document.body.classList.toggle("night");
  mode.innerHTML=document.body.classList.contains("night")?"☀️":"🌙";
};

/* CLOSE LETTER */
letter.onclick=()=>letter.style.display="none";
</script>

</body>
</html>
