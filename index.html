<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Deeksha ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* 🌙 NIGHT ROMANTIC BACKGROUND */
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Segoe UI',sans-serif;
  color:white;
  text-align:center;

  background:
    radial-gradient(circle at top, rgba(255,255,255,0.15), transparent 35%),
    linear-gradient(160deg,#0b0f2b,#1a123f,#2b0f45);

  background-size:200% 200%;
  animation:nightFlow 12s ease infinite;
}

@keyframes nightFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* 🌹 FALLING ROSE PETALS */
.petal{
  position:fixed;
  top:-30px;
  font-size:22px;
  opacity:0.9;
  animation:fallPetal linear forwards;
  z-index:0;
}

@keyframes fallPetal{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* PAGE */
.page{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
}

/* 💖 GLOWING NAME */
.glow{
  font-size:3.5rem;
  text-shadow:
    0 0 10px #ff5fa2,
    0 0 20px #ff2e63,
    0 0 40px #ff2e63;
}

/* HEART */
.heart{
  font-size:5rem;
  animation:beat 1.2s infinite;
}
@keyframes beat{50%{transform:scale(1.1);}}

/* BUTTONS */
button{
  font-size:1.2rem;
  padding:12px 35px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

#yesBtn{
  background:#ff2e63;
  color:white;
  box-shadow:0 0 15px #ff2e63;
}

#noBtn{
  background:white;
  color:#ff2e63;
  position:fixed;
  left:50%;
  top:60%;
  transform:translate(-50%,-50%);
  z-index:999;
}

/* SAD TEXT */
#sadText{
  margin-top:20px;
  font-size:1.4rem;
  min-height:2em;
}

/* SUCCESS PAGE */
#successPage{display:none;}

/* SLIDESHOW */
.slideshow img{
  width:180px;
  height:180px;
  border-radius:15px;
  object-fit:cover;
  margin-top:20px;
  box-shadow:0 0 20px rgba(255,46,99,0.6);
}

/* LOVE LETTER */
#letter{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:20;
}

#letter div{
  background:#1a123f;
  color:#ff9acb;
  padding:25px;
  border-radius:15px;
  width:80%;
  max-width:350px;
  box-shadow:0 0 25px #ff2e63;
}
</style>
</head>

<body>

<!-- QUESTION PAGE -->
<div class="page" id="questionPage">
  <div class="heart">❤️</div>
  <h1 class="glow">Deeksha</h1>
  <h2>Will you be my Valentine?</h2>
  <button id="yesBtn">YES 💖</button>
  <div id="sadText"></div>
</div>

<button id="noBtn">NO 🙄</button>

<!-- SUCCESS PAGE -->
<div class="page" id="successPage">
  <h1>YAYYYY 😍</h1>
  <h2 id="typingText"></h2>
  <div class="slideshow">
    <img id="slide" src="images/photo1.jpeg">
  </div>
  <p>Forever with you, Deeksha 🌙💍</p>
</div>

<!-- LOVE LETTER -->
<div id="letter">
  <div>
    <h2>My Love 🌹</h2>
    <p>
      Under this moonlit sky,<br>
      my heart chose you forever 💖
    </p>
    <p style="font-size:0.9rem;">(Tap anywhere to close)</p>
  </div>
</div>

<script>
/* 🌹 ROSE PETALS */
setInterval(()=>{
  const p=document.createElement("div");
  p.className="petal";
  p.textContent="🌹";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(6+Math.random()*6)+"s";
  p.style.fontSize=(18+Math.random()*20)+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),12000);
},700);

const noBtn=document.getElementById("noBtn");
const sadText=document.getElementById("sadText");
let count=0;
const messages=[
  "Are you sure? 😟",
  "Please don’t say no 🥺",
  "My heart is falling 💔",
  "I’ll wait forever 🌙",
  "You are my destiny 💖"
];

function moveNo(){
  count++;
  noBtn.style.left=Math.random()*80+"vw";
  noBtn.style.top=Math.random()*80+"vh";
  sadText.textContent=messages[Math.min(count-1,messages.length-1)];
}

noBtn.onmouseenter=moveNo;
noBtn.ontouchstart=moveNo;

/* YES */
yesBtn.onclick=()=>{
  questionPage.style.display="none";
  successPage.style.display="flex";
  noBtn.style.display="none";

  const text="You've made my nights magical 💫";
  let i=0;
  (function type(){
    if(i<text.length){
      typingText.textContent+=text[i++];
      setTimeout(type,60);
    }
  })();

  setTimeout(()=>letter.style.display="flex",2500);
};

letter.onclick=()=>letter.style.display="none";

/* SLIDESHOW */
const images=["images/photo1.jpeg","images/photo2.jpeg","images/photo3.jpeg"];
let idx=0;
setInterval(()=>{
  slide.style.opacity=0;
  setTimeout(()=>{
    slide.src=images[idx];
    slide.style.opacity=1;
    idx=(idx+1)%images.length;
  },300);
},2500);
</script>

</body>
</html>
