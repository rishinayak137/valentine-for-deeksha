<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Deeksha ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family:'Segoe UI',sans-serif;
  color:white;
  text-align:center;
}

/* PAGE */
.page{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:1;
}

h1{font-size:3.2rem;}
h2{font-weight:300;}

/* HEART */
.heart{
  font-size:5rem;
  animation:beat 1.2s infinite;
}
@keyframes beat{50%{transform:scale(1.1);}}

/* BUTTONS */
.buttons{
  margin-top:25px;
  position:relative;
  width:100%;
  height:160px;
}

button{
  font-size:1.2rem;
  padding:12px 35px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

#yesBtn{
  background:#ff2e63;
  color:white;
}

/* 🔒 NO BUTTON – FIXED FOREVER */
#noBtn{
  background:white;
  color:#ff2e63;
  position:fixed;
  left:50%;
  top:60%;
  transform:translate(-50%,-50%);
  z-index:9999;
}

/* SAD TEXT */
#sadText{
  margin-top:20px;
  font-size:1.5rem;
  min-height:2em;
  animation:shake 0.4s;
}
@keyframes shake{
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
}

/* CRYING EMOJI */
.cry{
  position:fixed;
  font-size:28px;
  animation:fall 3s linear forwards;
  z-index:0;
}
@keyframes fall{
  to{transform:translateY(100vh);opacity:0;}
}

/* SUCCESS PAGE */
#successPage{display:none;}

/* SLIDESHOW */
.slideshow img{
  width:180px;
  height:180px;
  border-radius:15px;
  object-fit:cover;
  margin-top:20px;
  transition:opacity 0.5s ease-in-out;
}

/* LOVE LETTER */
#letter{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:20;
}

#letter div{
  background:white;
  color:#ff2e63;
  padding:25px;
  border-radius:15px;
  width:80%;
  max-width:350px;
  text-align:center;
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  animation:fall 3s linear forwards;
}
</style>
</head>

<body>

<!-- QUESTION PAGE -->
<div class="page" id="questionPage">
  <div class="heart">❤️</div>
  <h1>Deeksha</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
  </div>

  <div id="sadText"></div>
</div>

<!-- NO BUTTON (GLOBAL & UNBREAKABLE) -->
<button id="noBtn">NO 🙄</button>

<!-- SUCCESS PAGE -->
<div class="page" id="successPage">
  <h1>YAYYYY 😍</h1>
  <h2 id="typingText"></h2>

  <div class="slideshow">
    <img id="slide" src="images/Photo1.jpg" alt="Our Memory" loading="lazy">
  </div>

  <p>Forever to go, Deeksha 💌</p>
</div>

<!-- LOVE LETTER -->
<div id="letter">
  <div>
    <h2>My Love 💖</h2>
    <p>
      From today, every heartbeat is yours.<br>
      Thank you for choosing me 🥹💍
    </p>
    <p style="font-size:0.9rem;">(Tap anywhere to close)</p>
  </div>
</div>

<!-- MUSIC -->
<div id="musicContainer"></div>

<script>
const noBtn = document.getElementById("noBtn");
const sadText = document.getElementById("sadText");
let noCount = 0;

const messages=[
  "Are you sure? 😟",
  "You are breaking my heart 💔",
  "Don't do this please 🥺",
  "I am a cute baby 😭👉👈",
  "Pleaseeeee 😭💖",
  "I will cry forever 😭😭😭"
];

/* 🚫 NO BUTTON NEVER DISAPPEARS */
function moveNo(){
  noCount++;

  const pad = 20;
  const maxX = window.innerWidth - noBtn.offsetWidth - pad;
  const maxY = window.innerHeight - noBtn.offsetHeight - pad;

  noBtn.style.left = Math.random()*maxX + "px";
  noBtn.style.top  = Math.random()*maxY + "px";

  sadText.textContent =
    messages[Math.min(noCount-1,messages.length-1)];

  for(let i=0;i<3;i++){
    const c=document.createElement("div");
    c.className="cry";
    c.textContent="😭";
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* YES BUTTON */
document.getElementById("yesBtn").onclick=()=>{
  questionPage.style.display="none";
  successPage.style.display="flex";
  noBtn.style.display="none";

  /* CONFETTI */
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff2e63","#fff","#ffd166"][Math.floor(Math.random()*3)];
    document.body.appendChild(c);
  }

  /* MUSIC */
  musicContainer.innerHTML=`
  <iframe id="song"
    width="0" height="0"
    src="https://www.youtube.com/embed/7BspO6r4Eog?autoplay=1&mute=1&playsinline=1"
    allow="autoplay">
  </iframe>`;

  setTimeout(()=>{
    const iframe=document.getElementById("song");
    iframe.src=iframe.src.replace("mute=1","mute=0");
  },1200);

  /* TYPING TEXT */
  const text="You've made me the luckiest person 💕";
  let i=0;
  (function type(){
    if(i<text.length){
      typingText.textContent+=text[i++];
      setTimeout(type,60);
    }
  })();

  /* LOVE LETTER */
  setTimeout(()=>letter.style.display="flex",3000);
};

/* CLOSE LETTER */
letter.onclick=()=>letter.style.display="none";

/* SLIDESHOW */
const images=[
  "images/Photo1.jpg",
  "images/Photo2.jpg",
  "images/Photo3.jpg"
];

let index=0;
const slide=document.getElementById("slide");

// preload
images.forEach(src=>{
  const img=new Image();
  img.src=src;
});

setInterval(()=>{
  slide.style.opacity=0;
  setTimeout(()=>{
    slide.src=images[index];
    slide.style.opacity=1;
    index=(index+1)%images.length;
  },300);
},2500);
</script>

</body>
</html>
